name: maison-lumiel-oracle
services:
  web:
    image: maison-lumiel-oracle:1
    build:
      context: ..
      dockerfile: Dockerfile
    user: "1000:1000"
    env_file:
      - ../.env.oracle
    environment:
      CLASSROOM_DATA_DIR: /data
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.oracle}
      PORT: "8000"
    volumes:
      - ${DATA_MOUNT:-/srv/maison-lumiel-data}/classroom:/data:rw
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 45s
    networks:
      - private
  gateway:
    image: caddy:2.10
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.oracle}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_MOUNT:-/srv/maison-lumiel-data}/caddy_data:/data:rw
      - ${DATA_MOUNT:-/srv/maison-lumiel-data}/caddy_config:/config:rw
    restart: unless-stopped
    networks:
      - private
networks:
  private:
    driver: bridge
