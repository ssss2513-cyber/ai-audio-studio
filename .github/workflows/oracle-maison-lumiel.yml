name: Oracle Maison Lumiel deployment template checks
on:
  push:
    branches: [maison-lumiel]
    paths:
      - "oracle-maison-lumiel/**"
      - ".github/workflows/oracle-maison-lumiel.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Oracle setup shell syntax
        run: |
          bash -n oracle-maison-lumiel/install-docker.sh
          bash -n oracle-maison-lumiel/prepare-data-disk.sh
          bash -n oracle-maison-lumiel/launch.sh
      - name: Check video importer and OCI UI build patch syntax
        run: python3 -m py_compile oracle-maison-lumiel/import_drive_video.py oracle-maison-lumiel/patch_oci_interface.py
      - name: Check Compose plan without printing secrets
        working-directory: oracle-maison-lumiel
        run: |
          cp .env.example .env
          sed -i 's/replace-with-your-domain.example/oci-ci-test.invalid/' .env
          cp runtime.env.example runtime.env
          docker compose --env-file .env -f compose.yaml config --quiet
          rm -f .env runtime.env
      - name: Build the OCI-specific app image
        working-directory: oracle-maison-lumiel
        run: |
          cp .env.example .env
          sed -i 's/replace-with-your-domain.example/oci-ci-test.invalid/' .env
          cp runtime.env.example runtime.env
          docker compose --env-file .env -f compose.yaml build app
          rm -f .env runtime.env
