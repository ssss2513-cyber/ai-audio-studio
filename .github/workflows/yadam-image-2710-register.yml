name: Register Yadam image 2.7.10 files
on:
  push:
    branches: [maison-lumiel]
    paths:
      - '.github/workflows/yadam-image-2710-register.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yadam-image-2710-registration
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maison-lumiel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify the exact supplied ZIP without network or hosting actions
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import io
          import json
          from pathlib import Path
          import zipfile

          root = Path('junyeong-classroom-luxe')
          package_root = root / 'shared-tools'
          expected_sha = '351e56fd791274062fc0b15999dcb90ce3faff6cc70b5083c8498990679fb1f1'
          expected_size = 5864222
          instruction_sha = 'bb433b5c002f0939e8a9c45b8cfc884abbbef17a9d3722b60794d8b3293911a1'
          catalogue = ast.parse((root/'shared_tools.py').read_text(encoding='utf-8'))
          packages = next(ast.literal_eval(node.value) for node in catalogue.body
                          if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'PACKAGES' for t in node.targets))
          item = next(p for p in packages if p['id'] == 'yadam-image-prompts')
          if item['version'] != '2.7.10' or item['sha256'] != expected_sha:
              raise ValueError('Image release changed; stop without downgrading or altering the catalogue')
          if item['asset'] != 'yadam-image-prompts-v2.7.10.zip':
              raise ValueError('Unexpected registered image-tool filename')
          spec = importlib.util.spec_from_file_location('image2710_release', root/'shared_tool_image2710.py')
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          raw = builder.rebuild_archive(
              (package_root/'yadam-image-prompts-v2.7.9.zip').read_bytes(),
              (package_root/'image2710-policy.md').read_bytes())
          if len(raw) != expected_size or hashlib.sha256(raw).hexdigest() != expected_sha:
              raise ValueError('Reconstructed archive differs from the exact 2.7.10 file supplied to the owner')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              if archive.testzip() is not None:
                  raise ValueError('ZIP CRC check failed')
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              if len(entries) != 79:
                  raise ValueError('Unexpected ZIP member count')
              instructions = archive.read('CLAUDE_PROJECT_INSTRUCTIONS.md')
              if hashlib.sha256(instructions).hexdigest() != instruction_sha:
                  raise ValueError('Project instructions differ from the separately supplied TXT')
              manifest = json.loads(archive.read('PACKAGE_MANIFEST.json'))
              for name, details in manifest['files'].items():
                  data = archive.read(name)
                  if len(data) != details['size'] or hashlib.sha256(data).hexdigest() != details['sha256']:
                      raise ValueError('Package manifest mismatch: ' + name)
              for entry in entries:
                  if entry.filename.endswith('.py'):
                      ast.parse(archive.read(entry).decode('utf-8-sig'), filename=entry.filename)
          destination = package_root/'yadam-image-prompts-v2.7.10.zip'
          instruction_path = package_root/'야담_프로젝트지침_2.7.10.txt'
          for path, data in ((destination, raw), (instruction_path, instructions)):
              if path.exists() and path.read_bytes() != data:
                  raise ValueError('A different file already exists: ' + str(path))
              path.write_bytes(data)
          report = {
              'version': '2.7.10', 'status': 'PASS', 'size': len(raw),
              'sha256': expected_sha, 'file_count': len(entries),
              'archive': destination.name, 'instructions': instruction_path.name,
              'instructions_sha256': instruction_sha,
              'checks': ['exact supplied ZIP bytes', 'ZIP CRC', 'manifest member checksums', 'Python syntax', 'separate instructions exact match'],
              'scope': 'Repository registration and file integrity only; not new program testing, image validation or live deployment'
          }
          (package_root/'yadam-image-prompts-v2.7.10.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit only archive, instructions and registration report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- junyeong-classroom-luxe/shared-tools/yadam-image-prompts-v2.7.10.zip
          git add -- 'junyeong-classroom-luxe/shared-tools/야담_프로젝트지침_2.7.10.txt'
          git add -- junyeong-classroom-luxe/shared-tools/yadam-image-prompts-v2.7.10.json
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Register exact Yadam 2.7.10 ZIP and separate project instructions'
            git push origin HEAD:maison-lumiel
          fi
          echo "Registered commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'ZIP SHA-256: 351e56fd791274062fc0b15999dcb90ce3faff6cc70b5083c8498990679fb1f1' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yadam-image-2.7.10-registered-files
          path: |
            junyeong-classroom-luxe/shared-tools/yadam-image-prompts-v2.7.10.zip
            junyeong-classroom-luxe/shared-tools/yadam-image-prompts-v2.7.10.json
            junyeong-classroom-luxe/shared-tools/야담_프로젝트지침_2.7.10.txt
          if-no-files-found: warn
          retention-days: 7
