name: maison-lumiel
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      CLASSROOM_DATA_DIR: /data
      PUBLIC_ORIGIN: https://${SITE_DOMAIN}
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DATA_HOST_PATH}:/data
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=6)"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 100s
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
networks:
  internal:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
