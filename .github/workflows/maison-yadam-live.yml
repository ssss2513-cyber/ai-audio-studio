name: Maison Lumiel live yadam home checks
on:
  push:
    branches: [maison-lumiel]
    paths:
      - "junyeong-classroom-luxe/**"
      - ".github/workflows/maison-yadam-live.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server Python code
        working-directory: junyeong-classroom-luxe
        run: python -m py_compile app.py cloud_app.py yadam_trends.py brand_build.py drive_streaming.py r2_storage.py
      - name: Check live browser JavaScript
        working-directory: junyeong-classroom-luxe
        run: |
          node --check web/app.js
          node --check web/lumiel.js
          node --check web/princess-theme.js
          node --check web/r2_upload.js
      - name: Check manual-approval rules
        working-directory: junyeong-classroom-luxe
        run: python -m unittest discover -s tests -p 'test_manual_approval.py' -v
      - name: Test Drive video byte ranges and error categorization
        working-directory: junyeong-classroom-luxe
        run: python -m unittest discover -s tests -p 'test_drive_streaming.py' -v
      - name: Test optional R2 free-tier storage controls
        working-directory: junyeong-classroom-luxe
        run: python -m unittest discover -s tests -p 'test_r2_storage.py' -v
      - name: Confirm brand build retains new feature
        working-directory: junyeong-classroom-luxe
        run: |
          python brand_build.py
          node --check web/app.js
          node --check web/lumiel.js
          grep -q 'yadam_home.css' web/index.html
          grep -q 'public/yadam-trends' web/app.js
          grep -q 'gptCollection()' web/app.js
          grep -q 'gpt-suite' web/app.js
          grep -q 'chatgpt.com/g/g-6a043cdc702081918b5996ee47484ee0' web/app.js
          grep -q 'chatgpt.com/g/g-6a046731b9c881919da07e6eefd367ee' web/app.js
          grep -q 'chatgpt.com/g/g-69f6e703b758819180229c897401aae8' web/app.js
          grep -q 'chatgpt.com/g/g-69d8fc9f44ec8191834cbd255347a240' web/app.js
          grep -q 'chatgpt.com/g/g-6a4b4dcbb180819190bbb4a4fa9f109b' web/app.js
          grep -q 'gpt-suite-v2' web/index.html
          grep -q 'princess-theme.css' web/index.html
          grep -q 'princess-theme.js' web/index.html
          grep -q 'princess-sidebar' web/index.html

