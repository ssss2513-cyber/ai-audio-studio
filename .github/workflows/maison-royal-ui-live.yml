name: Verify Maison Lumiel photo-first homepage on DigitalOcean
on:
  push:
    branches: [maison-lumiel]
    paths:
      - "junyeong-classroom-luxe/web/maison-photo-home.css"
      - "junyeong-classroom-luxe/web/maison-photo-home.js"
      - "junyeong-classroom-luxe/web/maison-reference.avif"
      - "junyeong-classroom-luxe/web/maison-mobile-photo.avif"
      - "junyeong-classroom-luxe/web/index.html"
      - ".github/workflows/maison-royal-ui-live.yml"
  workflow_dispatch:

jobs:
  public-photo-home:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DigitalOcean serves the existing generated image and interactive homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://143-198-87-243.sslip.io"
          READY=false
          for attempt in $(seq 1 10); do
            echo "Checking production homepage: ${attempt}/10"
            if curl -fsSL --max-time 15 "$URL/?photo_check=20261029-gold-video-motion-v1" -o /tmp/maison-index.html &&
               grep -q 'maison-photo-home.css?v=20261029-gold-video-motion-v1' /tmp/maison-index.html &&
               grep -q 'maison-photo-home.js?v=20261029-gold-video-motion-v1' /tmp/maison-index.html; then
              READY=true
              break
            fi
            sleep 12
          done
          if [ "$READY" != true ]; then echo "Updated homepage is not on the live site yet."; exit 1; fi
          for asset in maison-photo-home.css maison-photo-home.js maison-reference.avif maison-mobile-photo.avif; do
            curl -fsSL --max-time 20 "$URL/assets/$asset?photo_check=20261029-gold-video-motion-v1" -o "/tmp/$asset"
            test -s "/tmp/$asset"
            echo "$asset served, bytes: $(wc -c < "/tmp/$asset")"
          done
          grep -q 'maison-reference.avif' /tmp/maison-photo-home.css
          grep -q 'maison-photo-desktop' /tmp/maison-photo-home.js
          grep -q 'maison-photo-video-slot' /tmp/maison-photo-home.js
          grep -q 'maison-mobile-video-slot' /tmp/maison-photo-home.js
          grep -q 'maison-photo-motion-toggle' /tmp/maison-photo-home.js
          grep -q 'royal-workroom-m7q4n9.ssss2513.chatgpt.site/' /tmp/maison-photo-home.js
          grep -q 'junyoung-image-placer.ssss2513.chatgpt.site/' /tmp/maison-photo-home.js
          node --check /tmp/maison-photo-home.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('/tmp/maison-photo-home.js').read_text(encoding='utf-8')
          css=Path('/tmp/maison-photo-home.css').read_text(encoding='utf-8')
          html=Path('/tmp/maison-index.html').read_text(encoding='utf-8')
          assert '라이브 송출' not in js and '라이브 송출' not in html, "Removed live menu is still in HTML"
          assert 'maison-film-stash' in js and 'mountIntroFilm' in js, "Intro film is not being moved to the live photo frame"
          assert '.maison-photo-video-slot .lumiel-film' in css, "Desktop film-frame CSS missing"
          assert '.maison-mobile-video-slot .lumiel-film' in css, "Mobile film-frame CSS missing"
          assert 'princess-side-motion-toggle' in html, "Sidebar motion switch missing"
          print('PASS: intro moved inside gold frame, motion UI and external links present; live menu removed')
          PY
          video_http=$(curl --silent --show-error --location --range 0-1023 --max-time 25 --output /tmp/maison-film-probe --write-out '%{http_code}' "$URL/api/public/brand-intro.mp4")
          echo "intro film HTTP $video_http, bytes $(wc -c </tmp/maison-film-probe)"
          test "$video_http" = 206 || test "$video_http" = 200
          test -s /tmp/maison-film-probe
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/maison-reference.avif').read_bytes()
          assert len(data)>80000 and data[4:12].startswith(b'ftypavif'), "Actual generated AVIF photo missing"
          mobile=Path('/tmp/maison-mobile-photo.avif').read_bytes()
          assert len(mobile)>15000 and mobile[4:12].startswith(b'ftypavif'), "Mobile palace photo missing"
          print("PASS: Real generated image bytes served successfully")
          PY
      - name: Capture desktop and mobile home screenshots for comparison
        shell: bash
        continue-on-error: true
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No headless Chrome binary available on the runner."
            exit 0
          fi
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1672,941 --virtual-time-budget=5500 \
            --screenshot=/tmp/maison-royal-desktop.png \
            'https://143-198-87-243.sslip.io/?photo_check=20261029-gold-video-motion-v1#home'
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=393,852 --virtual-time-budget=5500 \
            --screenshot=/tmp/maison-royal-mobile.png \
            'https://143-198-87-243.sslip.io/?photo_check=20261029-gold-video-motion-v1#home'
          ls -lh /tmp/maison-royal-*.png
      - name: Save site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-photo-home-qa
          path: |
            /tmp/maison-royal-desktop.png
            /tmp/maison-royal-mobile.png
          if-no-files-found: warn
          retention-days: 7
